name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calibre
          POSTGRES_PASSWORD: calibre_test
          POSTGRES_DB: calibre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calibre -d calibre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust toolchain and components
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'backend/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci --prefix frontend
      - name: Formatting, lint, types, tooling probes, and Rust tests
        run: npm run check
      - name: PostgreSQL migration and persistence
        run: sh scripts/check-persistence.sh
        env:
          TEST_DATABASE_URL: postgres://calibre:calibre_test@127.0.0.1:5432/calibre_test
      - run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
